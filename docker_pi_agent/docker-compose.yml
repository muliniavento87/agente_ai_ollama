services:
  pi-agent:
    build:
      context: ./_include_docker
      dockerfile: Dockerfile
    container_name: pi-agent-dev
    network_mode: "host"
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      #- .:/workspace
      - ./docker_workspace:/workspace
      - ./docker_workspace_metadati:/workspace_metadati
      - ./docker_scripts:/scripts
      - ./docker_server_mcp:/server_mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # basta modificare l'indirizzo OLLAMA in Dockerfile "baseUrl"
      - http://host.docker.internal:11434
    stdin_open: true
    tty: true
