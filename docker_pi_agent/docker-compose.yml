services:
  pi-agent:
    build:
      #context: ./_include_docker
      context: .
      dockerfile: Dockerfile
    container_name: pi-agent-dev
    network_mode: "host"
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      # bind FILES
      #- type: bind
      #  source: ./_include_docker/init.sh
      #  target: /init.sh
      # bind CARTELLE
      - ./docker_workspace:/workspace
      - ./_include_docker/docker_workspace_metadati:/workspace_metadati
      - ./_include_docker/docker_pi_agent:/etc/.pi/agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PI_CODING_AGENT_DIR=/etc/.pi/agent
      # di default scarica le skills SOLO la prima volta (se vuoi forzarlo a riscaricarle, es. per update, metti "true")
      - FORCE_DOWNLOAD_MATTPOCOCK_SKILLS=false
      # basta modificare l'indirizzo OLLAMA in Dockerfile "baseUrl"
      - http://host.docker.internal:11434
    stdin_open: true
    tty: true
