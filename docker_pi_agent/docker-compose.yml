services:
  pi-agent:
    build:
      context: ./_include_docker
      dockerfile: Dockerfile
    container_name: pi-agent-dev
    network_mode: "host"
    volumes:
      - .:/workspace
      #- /Users/giuseppe.alfieri/work/mediolanum:/workspace
      #- /Users/giuseppe.alfieri/work/:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # basta modificare l'indirizzo OLLAMA in Dockerfile "baseUrl"
      - OLLAMA_HOST=http://host.docker.internal:11434 #OLLAMA_HOST=http://192.168.1.219:11434
    stdin_open: true
    tty: true