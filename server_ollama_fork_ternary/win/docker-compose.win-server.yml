name: ternary-bonsai-server

services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: ternary-bonsai/llama-server:prism-b10709-9a9394a
    environment:
      LLAMA_BIN: cuda
      # Selettore modelli Ternary Bonsai 2:
      # 0 = Ternary-Bonsai-2-27B
      # 1 = Ternary-Bonsai-2-9B
      # 2 = Ternary-Bonsai-2-4B
      MODELLO_ATTIVO: "2"
      
      # Ottimizzazione VRAM / Contesto
      LLAMA_CTX: 32768
      LLAMA_PRELOAD: 1
      LLAMA_PARALLEL: 1
      LLAMA_CACHE_TYPE_K: q8_0
      LLAMA_CACHE_TYPE_V: q4_0
      LLAMA_NGL: 99
      LLAMA_FLASH_ATTN: "on"
      
      # Sampling
      LLAMA_TEMP: 0.6
      LLAMA_TOP_P: 0.95
      LLAMA_TOP_K: 20
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 600
      start_period: 120s
    restart: unless-stopped